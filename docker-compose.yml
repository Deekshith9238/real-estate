version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/nripropservices
      - NODE_ENV=development
      - PORT=5173
    ports:
      - "5173:5173"
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  migrator:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run db:push
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/nripropservices
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nripropservices
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d nripropservices" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
